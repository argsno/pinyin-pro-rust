[package]
name = "pinyin_pro"
version = "3.29.4"
edition = "2021"
description = "Rust port of pinyin-pro: Chinese to pinyin with tone, initials, finals, polyphone, matching and segmentation"
license = "MIT"
repository = "https://github.com/argsno/pinyin-pro"
keywords = ["pinyin", "chinese", "hanzi"]

[lib]
name = "pinyin_pro"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Node.js native addon via napi-rs
napi = ["dep:napi", "dep:napi-derive", "dep:serde", "dep:serde_json"]
# WebAssembly bindings via wasm-bindgen (JSON in/out)
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde_json"]

[dependencies]
regex = "1"
napi = { version = "2", optional = true, default-features = false, features = ["napi9"] }
napi-derive = { version = "2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
